name: Electricity Calculator CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t electricity-bill-calculator:ci .

      - name: Check calculation inside Docker
        run: |
          docker run --rm electricity-bill-calculator:ci \
            python -c "from app import calculate_bill; assert calculate_bill(150, 0.30) == 45.0; print('Container calculation check passed')"

            - name: Check web server inside Docker
        run: |
          docker run -d \
            --name calculator-web \
            -p 127.0.0.1:8000:8000 \
            electricity-bill-calculator:ci

          trap 'docker ps -a --filter name=calculator-web; docker logs calculator-web; docker rm -f calculator-web' EXIT

          echo "Waiting for the web server..."
          curl --fail --retry 15 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8000/health

          echo "Checking the calculation..."
          curl --fail \
            --data "units=150&price=0.30" \
            http://127.0.0.1:8000/calculate | grep -q "45.00"

          echo "Web container checks passed."

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build image for publishing
        run: |
          docker build \
            -t ghcr.io/srp500005/electricity-bill-calculator:latest \
            -t ghcr.io/srp500005/electricity-bill-calculator:${{ github.sha }} \
            .

      - name: Publish Docker image
        run: |
          docker push ghcr.io/srp500005/electricity-bill-calculator:latest
          docker push ghcr.io/srp500005/electricity-bill-calculator:${{ github.sha }}