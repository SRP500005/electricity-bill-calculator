name: Electricity Calculator CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t electricity-bill-calculator:ci .

      - name: Check calculation inside Docker
        run: |
          docker run --rm electricity-bill-calculator:ci \
            python -c "from app import calculate_bill; assert calculate_bill(150, 0.30) == 45.0; print('Container check passed')"